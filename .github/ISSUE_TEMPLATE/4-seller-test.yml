name: Seller-funded test (endpoints above $0.05)
description: Verify your own endpoint when it costs more per call than our tester pays on its own. You fund a test at your own price; it's held for that test and the money goes back to your payout wallet.
title: "Seller test: <endpoint>"
labels: ["seller-test"]
body:
  - type: markdown
    attributes:
      value: |
        Our tester pays endpoints up to $0.05 per call on its own. Above that, an endpoint stays **C (unconfirmed)** until a paid test confirms it delivers.
        Here's how a funded test works:
        1. When you submit, a bot replies with your endpoint's price and a payment link (x402, USDC on Base).
        2. You pay that price once, to our tester wallet. It's held for your test only.
        3. Our tester pays your endpoint the same amount, so the money lands back in your payout wallet. Anything the test doesn't spend is returned to you.
        4. The test runs at a random time within about 3 hours. The bot posts the result here and closes the issue.

        **The grade comes only from what the test finds.** A funded test can't buy a grade: every funded test and its result is listed on your endpoint's page.
        If the test can't run within 3 days (for example, the endpoint is down), the whole funding is refunded to the wallet that paid it. You can fund another test whenever you like, one at a time.
  - type: input
    id: endpoint
    attributes:
      label: Endpoint URL
      description: The full x402 endpoint, including the path, exactly as listed.
      placeholder: https://api.example.com/v1/data
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I understand the test result decides the grade, whether it passes or fails.
          required: true
