name: Grade dispute auto-reply
on:
  issues:
    types: [opened]
permissions:
  issues: write
  contents: read
jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const run = require('./.github/scripts/grade-dispute.js');
            const result = await run({ github, context });
            core.info(`grade dispute: ${result}`);
